[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interruptible-realtime-agent"
version = "0.1.0"
description = "Interruptible Real-Time Agent Runtime with dual-path processing, state versioning, and deterministic evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0,<3.0.0", "jsonschema>=4.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
openai = ["openai>=1.0.0"]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]
